# Maplewing Press site settings. GitHub Pages builds this with Jekyll automatically.
title: Maplewing Press
description: An independent publisher of thoughtfully made books, home of the Maplewing Dreams coloring series for older adults.
# The site is served at the custom domain (see the CNAME file), so baseurl stays empty.
url: "https://maplewingpress.com"
baseurl: ""
contact_email: hello@maplewingpress.com
facilities_email: facilities@maplewingpress.com
support_email: support@maplewingpress.com
# MailerLite account number (the signup forms post straight to it).
mailerlite_account: "2702036"
# General mailing-list form id (MailerLite "Dreams - Mailing list"): the band above the footer and the slide-in box on every page except the printable-pages pages. Leave blank to hide them.
# Each printable-pages page has its own signup_form_id, for its level group.
signup_form_id: "201227031161078874"
# thankyou_form_id: MailerLite form for print-page visitors who want the one thank-you email
# (bonus pages) but did NOT tick the mailing-list box. Blank hides the box until it exists.
thankyou_form_id: "201877270636266984"
# Book-owner prices (facility $36, Family Set $15) are separate Unlisted Payhip products. Their links are shown
# only after the order-number step (in each level's download form confirmation), never on the website.
# Family Set (all three levels as printable downloads, one household): $24, or $15 for book owners.
# family_set_url = the public ($24) Payhip checkout link. Leave blank until it exists; the box then says "coming soon".
family_set_url: "https://payhip.com/b/av4xf"
# family_set_key: Payhip product key; when set, the Family Set box shows Payhip's mini product page.
family_set_key: "av4xf"
exclude:
  - README.md
  - docs/
