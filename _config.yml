# Maplewing Press site settings. GitHub Pages builds this with Jekyll automatically.
title: Maplewing Press
description: Gentle coloring stories for older adults, and storybook readers for young learners.
# While the site lives at maplewingpress.github.io/maplewingpress, baseurl must be "/maplewingpress".
# When maplewingpress.com is connected, change url to "https://maplewingpress.com" and baseurl to "".
url: "https://maplewingpress.github.io"
baseurl: "/maplewingpress"
contact_email: hello@maplewingpress.com
facilities_email: facilities@maplewingpress.com
support_email: support@maplewingpress.com
# Optional email list (Kit). Leave blank until the Kit form exists; the signup box hides itself.
kit_form_url: ""
exclude:
  - README.md
  - docs/
